# 倒闸操作领域词表
#
# 槽位抽取用的是"分层跨度标注"：按下面的顺序逐层在句子上打标记，
# 先被标注的跨度不会再被后面的层抢走。这样 "拉开110kV桥100开关" 里的
# "拉开" 会先被认成动作，剩下的 "桥100开关" 才轮到设备抽取，
# 避免设备名把前面的动词一起吞进去。
#
# 每一层内部按字符串长度从长到短匹配，保证 "电气位置指示" 优先于 "位置指示"。

# ---------------------------------------------------------------
# 位置值：用在 "由X切至Y" 结构里，也可能单独出现
# 同一 group 内的值互斥，出现了组内的其它值就判 CONFLICT（矛盾），
# 这是区分操作票第 2 条和第 5 条（远方↔就地方向相反）的关键。
# ---------------------------------------------------------------
positions:
  group: position
  values:
    - 远方
    - 就地
    - 并列
    - 解列
    - 分闸
    - 合闸
    - 投入
    - 退出
    - 信号
    - 跳闸

# ---------------------------------------------------------------
# 对象 / 指示类型：区分"查后台电气信号"还是"查现场机械指示"
# 这是区分操作票第 4 条和第 7 条的关键槽位
# ---------------------------------------------------------------
objects:
  group: object
  values:
    - 电气位置指示
    - 机械位置指示
    - 位置指示
    - 负荷转移指示
    - 电压三相指示
    - 三相指示
    - 电流指示
    - 电压指示
    - 潮流指示
    - 相指示

# ---------------------------------------------------------------
# 把手 / 操作装置
# ---------------------------------------------------------------
handles:
  group: handle
  values:
    - 操作方式把手
    - 电压并列把手
    - 同期把手
    - 远方就地把手
    - 切换把手
    - 把手
    - 压板
    - 空开
    - 空气开关

# ---------------------------------------------------------------
# 核心动作：真正改变设备状态的动词，必须命中
# ---------------------------------------------------------------
actions:
  group: action
  values:
    - 切至
    - 拉开
    - 合上
    - 断开
    - 投入
    - 退出
    - 取下
    - 装上
    - 解锁
    - 闭锁
    - 送电
    - 停电
    - 复归

# ---------------------------------------------------------------
# 操作类型：区分"执行操作"和"检查确认"
# 操作票里 "拉开110kV桥100开关"（执行）和
# "检查...确已拉开"（确认）是两条独立的操作，靠这一层区分
# ---------------------------------------------------------------
check_markers:
  group: check_type
  values:
    - 检查
    - 核对
    - 确认
    - 验明

# ---------------------------------------------------------------
# 屏柜 / 位置：可省略，只加分不否决
# ---------------------------------------------------------------
panels:
  values:
    - 测控屏
    - 保护屏
    - 主控屏
    - 中央信号屏
    - 直流屏
    - 端子箱
    - 机构箱
    - 汇控柜
    - 后台机
    - 监控后台

# ---------------------------------------------------------------
# 状态确认词与程度副词：口语里最容易被省略，权重给最低
# ---------------------------------------------------------------
states:
  values:
    - 确已
    - 已经
    - 正确
    - 良好
    - 符合
    - 无误

# ---------------------------------------------------------------
# 设备类型后缀：用于从剩余文本里正则抽设备编号
# 例如 "桥100开关"、"1号主变"、"I段母线"（归一化后成 "1段母线"）
# ---------------------------------------------------------------
device_suffixes:
  - 隔离开关
  - 接地刀闸
  - 接地开关
  - 断路器
  - 开关
  - 刀闸
  - 熔断器
  - 段母线
  - 母线
  - 线路
  - 主变
  - 变压器
  - 电容器
  - 电抗器
  - 消弧线圈
  - 站用变

# ---------------------------------------------------------------
# 设备名前缀里允许出现的间隔字（正则抽设备时向前扩展的白名单）
# 台账词典（configs/stations/*_assets.txt，由现场提供）会优先于这里的规则
# ---------------------------------------------------------------
device_prefix_chars: "桥母联分段旁路主副内外正备用号段甲乙丙丁东西南北上下前后左右"

# ---------------------------------------------------------------
# 停用词：残余槽位里剔除掉，避免虚词稀释相似度
# ---------------------------------------------------------------
stopwords:
  - 将
  - 把
  - 由
  - 至
  - 到
  - 的
  - 了
  - 位置
  - 状态
  - 系统
  - 条件
  - 及
  - 和
  - 与

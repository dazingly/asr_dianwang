# 菏泽方言（中原官话）模糊音等价类
#
# 比对时把每个音节规范化到"代表音"，从而让口音差异和同音字错误落到同一个桶里。
# 每组的第一个元素是代表音，组内其余元素都会被映射过去。
# 声调一律忽略（方言声调与普通话差异过大，参考价值低）。
#
# 调优方式：P0 基线实测跑出来的错误样本，如果是口音导致的，就往这里加组。
# 加得越多召回越高、误判也越多，需要用 tests/ 里的对抗样例回归验证。

# 是否启用模糊音。关掉后退化为标准无声调拼音比对。
enabled: true

# 是否把多音字的所有异读都纳入候选。
# 打开会显著放宽匹配（"位" 会带上罕见的 li 读音、"示" 会带上 qi），
# 对本任务弊大于利 —— 误判通过的代价远高于误判不通过，所以默认关闭，
# 改由 pypinyin 的分词给出上下文最优读音。
heteronym: false

# 声母等价类（匹配音节开头，长的优先）
initials:
  # 平翘舌不分，中原官话最典型的特征
  - ["z", "zh"]
  - ["c", "ch"]
  - ["s", "sh"]
  # n / l 混读
  - ["l", "n"]
  # r 声母弱化为 y（"热" 读近 "叶"）
  - ["y", "r"]

# 韵母等价类（匹配音节结尾，长的优先）
# 注意 ang -> an 会顺带覆盖 iang -> ian、uang -> uan，不需要单独列。
finals:
  - ["in", "ing"]
  - ["en", "eng"]
  - ["an", "ang"]

# 整音节等价类（在声母/韵母规则之后应用，用于处理规则覆盖不了的个案）
# hu / fu 混读在菏泽部分区县存在，但合并 f 和 h 声母副作用太大，
# 所以只在整音节层面做定点处理。
syllables:
  - ["fu", "hu"]
  - ["fei", "hui"]

# 数字的可选读法。归一化层已经把中文数字统一成阿拉伯数字，
# 这里是兜底：万一 ASR 把数字词识别成了别的同音字，仍能靠读音对上。
digit_readings:
  "0": ["ling", "dong"]
  "1": ["yi", "yao"]
  "2": ["er", "liang"]
  "3": ["san"]
  "4": ["si"]
  "5": ["wu"]
  "6": ["liu"]
  "7": ["qi"]
  "8": ["ba"]
  "9": ["jiu"]

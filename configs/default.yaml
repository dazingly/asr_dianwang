# 倒闸操作唱票复述校验 - 主配置

paths:
  # 识别模型。换成别的模型目录时，engine 只认目录名和 funasr 能否加载它。
  model_dir: models/Paraformer-Large
  lexicon: configs/lexicon.yaml
  dialect: configs/dialect_heze.yaml
  # 现场设备台账，一行一个设备/间隔全称。文件不存在时自动降级为纯正则抽取。
  asset_list: configs/stations/xiaoliu_assets.txt

asr:
  # auto = 有 CUDA 就用 GPU，否则回退 CPU
  device: auto
  batch_size_s: 60

  # 流式 Paraformer（src/asr/streaming.py）。打开后服务端边收音频边识别，
  # VAD 定段时直接返回该段文本；关闭则退回离线 VAD + 整段识别。
  # 模型目录不存在/加载失败时服务自动回退，不会起不来。
  streaming:
    enabled: true
    model_dir: models/Paraformer-Streaming
    # 600ms 一喂；与模型训练时的 chunk_size=[0,10,5] 对齐。
    chunk_ms: 600
    encoder_chunk_look_back: 4
    decoder_chunk_look_back: 1
    # VAD 自己的块长与句首预卷。VAD 报起点有延迟，预卷保证不丢句首。
    vad_chunk_ms: 200
    preroll_ms: 400
    vad_device: cpu
    # 未定段文本（partial），仅供前端做实时字幕，不参与判定。
    partial: true
    # 2-pass：段结束后用离线大模型复核流式文本。现场远场录音上流式模型
    # 漏字明显，严格判定必须吃离线文本；流式文本保留在 stream_text 里。
    refine_with_offline: true

service:
  # 常驻识别服务（scripts/asr_service.py）监听在哪里。
  # 只监听本机：模型没有鉴权，不该让局域网里的任何机器都能调。
  host: 127.0.0.1
  port: 8766
  # 流式会话保留的音频秒数：VAD 起点晚到时回切句首用。
  buffer_seconds: 60

vad:
  # FSMN 是唯一的分段器。Silero 试过并否掉了：它在干净基准集上误报率低得多，
  # 但现场远场录音底噪高，条目之间的停顿达不到它的静音判据，会把整条操作并成
  # 一段 —— 而这条链路"切长"比"切短"代价大得多，一段文本只认一条票，一段吃掉
  # 好几条内容时只有一条能得分，其余落进"未确认"。
  fsmn_model: fsmn-vad
  # 尾静音判定时长(ms)，直接决定实时链路的端点延迟。
  # 默认 500ms 是 funasr 的值，实时场景压到 300ms 换取更低延迟。
  max_end_silence_time: 300
  max_single_segment_time: 30000
  # 短于该时长的语音段直接丢弃（咳嗽、碰撞声）
  min_speech_ms: 300

speaker:
  # 设备绑在操作人身上，操作人是近场高能量、唱票人是远场低能量。
  # 段级 RMS 高于能量基线这个倍数的判为操作人（近场）。
  near_field_rms_ratio: 1.6

adhere:
  # 识别后吸附：把 ASR 听岔的领域词按读音吸附回台账/词表的标准写法。
  # 吸附在匹配之前执行，且完全不看操作票 —— 只找"最像的词"，不找"票面上
  # 写的词"，所以操作人真说错了不会被洗白。详见 src/normalize/adhere.py。
  enabled: true
  # 最低模糊音相似度。两个字的目标词在这个阈值下等价于"必须同音"，
  # 吸附只修听音错误，不改判语义。
  threshold: 0.9
  # 除站点设备台账外，是否也吸附词表里的位置值、动作、检查词、状态等。
  # 实测领域词听错是当前最主要的误报来源，默认打开；关掉就退化成
  # 只吸附设备全称。
  include_lexicon: true

matcher:
  # 书写层必须区分、但语音层同音的词对。拼音等价会把它们判成
  # "念对了"，只有在这里登记才能拦住（负荷/符合、电压/电牙…）。
  confusable_pairs:
    - ["负荷", "符合"]

kir:
  # KIR 严格匹配（src/verify/kir_matcher.py）。
  # VERIFIED 必须所有字段 EXACT/EQUIVALENT；没有分数阈值可调。
  strict: true
  # 方言等价后拼音完全相等视为同一事实。
  pinyin_equivalent: true
  # 编号只比 core（312-1 与 3121 分隔符差异在语音层不可靠，不判差异）。
  id_core_only: true
  # 判 CONFLICT 所需的最低证据权重：动作命中 1、目标配对 2、状态 0.5。
  # 低于这个值说明只是"字面有重合"，不能据此报"说错了"。
  min_evidence: 2.0

verdict:
  # 三档判定阈值。灰区交人工复核。
  # 宁可多产生灰区，也不能漏报不合格 —— 阈值调优的目标函数是漏报率。
  pass_threshold: 0.82
  review_threshold: 0.60

  # 必要槽位"缺失"时怎么处理。
  #   review = 最高只能判到灰区（默认）—— 缺失可能只是简述省略
  #   fail   = 直接判不通过 —— 要求逐字念全时用这个
  # 注意必要槽位"矛盾"（念成了同组的另一个值）永远是直接不通过，
  # 因为那不是省略，是说错了。
  missing_required_action: review

aligner:
  # 每条操作项至少需要几次"完整正确"的复述。2 = 唱票一次 + 复诵一次。
  # 只认 KIR FULL；漏字/多说/没听清的尝试不计数，闲聊不计数。
  # 角色判定不参与这里：只数内容完整出现的次数。
  required_confirmations: 2

  # 超过所需次数后的重复怎么处理：
  #   audit  = 正确重复幂等；不完整重复只留痕，不改变结论（默认）
  #   strict = 已通过的条目遇到额外不完整重复时降为灰区，等人工复核
  extra_repeat_policy: audit

  # 完整复述出现矛盾后，后续完整复述是否允许把 FAILED 纠正为 VERIFIED。
  # 严格审计默认不允许：说错就是错，不因为后面又念对而消失。
  failure_is_final: true

  # 未完成尝试里出现矛盾时，不按"完整念错"判失败，只记 ABORTED_CONFLICT
  # 留痕（没念完就重读、重读过程中的口误都属于这一类）。
  conflict_requires_complete: true

  # 判断"完整念完"的票面覆盖率阈值。只有在出现矛盾且有缺失字段时用它：
  # 覆盖率达到该值 -> 认为整条都念了，只是某个值错；低于它 -> 认为没念完。
  complete_coverage: 0.7

  # 同一段里"半句 + 完整重读"时，从重读起点截断后缀再匹配。
  restart_aware: true
  max_restart_candidates: 12

  # 严格按序执行，但留前瞻窗口容忍偶发的重复确认和返工
  lookahead: 2
  # 允许回看已完成的条目，用于识别"重复复述同一条"和迟到补齐
  lookback: 2
  # 低于这个分数的语音段判为闲聊/无关，静默丢弃
  chatter_threshold: 0.45

  # 一段内容不完整时先挂起，等下一段来了拼起来重判。这个值是采纳拼合
  # 所需的最低分数增益 —— 拼合后的分数要比两段各自的最好分高出这么多
  # 才认，否则照原样落地（见 aligner._try_stitch）。
  #
  # 判据选"增益"而不是"静音间隔"或"角色"，是因为只有它能自校验：音频层
  # 按间隔合并会把唱票和复述粘到一起，而这两者的内容本来就是同一句，按内容
  # 也分不开。实测小留 ticket1 的增益分布：该拼的（同一句话被切成上下半截）
  # +0.38，勉强够格的 +0.07，而唱票尾巴粘操作人头、闲聊两段相拼一律为负。
  # 门槛取在这两档之间。
  stitch_gain: 0.10

alerts:
  # 严格提醒：任何非完全匹配都产生一条前端可消费的提醒。
  # 提醒是旁路通知 —— 只读判定结果，不改变指针、不跳过条目、不阻塞流程。
  # 关闭后逐段行的提醒字段为空，判定结果与开启时完全一致（回退开关）。
  enabled: true

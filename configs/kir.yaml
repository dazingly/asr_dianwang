# ---------------------------------------------------------------------------
# 电压 / 质量
# ---------------------------------------------------------------------------

# 标准电压等级，从长到短匹配。用于拆 1CLP235kV 这种粘连。
standard_voltages:
  - 1000kv
  - 750kv
  - 500kv
  - 330kv
  - 220kv
  - 110kv
  - 66kv
  - 35kv
  - 20kv
  - 10kv
  - 6kv

# 票面 OCR/录入噪声。仅打标，不自动纠错。
ocr_tokens:
  方武: 方式
  场至: 切至
  护手: 把手
  分留: 分裂
  分刘: 分裂
  转档: 转带
  顺环: 合环
  地手电: 把手由
  确环: 合环
  场在: 确在
  分园: 分图
  地手: 把手
  压庄板: 压板
  期1: "#1"

# 压板编号与被控设备编号的分割。票面经常把两者连写：
#   1C12LP13110 = 压板 1C12LP13 + 开关 110
#   2-RLP2111   = 压板 2-RLP2   + 开关 111
#   52LP273112  = 压板 52LP273  + 开关 112
# 按顺序尝试；分割后左半段作为 id，右半段留在原文里成为限定词。
# 只对压板/把手类目标生效，避免把普通设备编号拆开。
plate_id_splits:
  - '(?i)^(?P<plate>.+?c\d+lp13)(?P<dev>\d{1,4}(?:-[0-9a-z]+)*)$'
  - '(?i)^(?P<plate>.+?clp\d{2})(?P<dev>\d{2}(?:-[0-9a-z]+)*)$'
  - '(?i)^(?P<plate>.+?lp\d{1,2})(?P<dev>\d{3}(?:-[0-9a-z]+)*)$'
  - '(?i)^(?P<plate>.+?lp\d{3})(?P<dev>\d{3}(?:-[0-9a-z]+)*)$'

# 后缀层级：子 -> 父。P1 只用于报告，P2 matcher 用于 SPECIALIZED 判定。
suffix_hierarchy:
  软压板: 压板
  硬压板: 压板
  保护压板: 压板
  功能压板: 压板
  出口压板: 压板
  跳闸出口压板: 出口压板
  重合闸出口压板: 出口压板
  接地刀闸: 刀闸
  空气开关: 开关
  负荷开关: 开关

quality:
  # 归一化后长度不超过该值且无动作/目标/状态，判残片
  fragment_max_len: 4
  # 票面引号对
  quote_pairs:
    - ["“", "”"]
    - ["‘", "’"]

# KIR 词表与抽取规则（P1 初版）
#
# 这份词表来自 docs/corpus_analysis 的 944 条语料统计，外加倒闸操作标准术语。
# 所有词条在加载时会走 normalize()；这里保持票面标准写法即可。
#
# 抽取顺序见 src/ticket/kir.py：
#   转换结构 -> 确认结构 -> 状态 -> 检查 -> 执行动作 -> 目标 -> 质量闸门

